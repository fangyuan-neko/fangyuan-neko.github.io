y-0.5 text-xs text-ink no-underline transition-colors duration-200 hover:text-accent" href="/categories/po/">po</a></div></div></header><p>薇卒于二七，世人皆叹息，曰何必。</p>
<p>我与汝何其似，却望一统天下，重周武之盛世，是讽是惊，尚且未知，念送君一曲，愿以此纪念。</p>
<p>人生惨痛几时尽？恨意难了。平生才情可通天，却叫白丁笑。人道无情却有情，一生一人爱恨总难消！</p>
<p>昨夜天牢入清风，案冤假狱。门卒不了吾身世，蔑我青楼女。知尽人间冷暖情，风流总被雨打风吹去！</p>
<p>谨以此纪念</p>
<p>——方圆</p></article></main><div id="search-overlay" style="display: none;"><input type="text" id="search-input" placeholder="Search articles..." aria-label="Search"><div id="search-results"></div></div><script type="module">var e=document.getElementById(`theme-toggle`),t=document.querySelector(`.sun-icon`),n=document.querySelector(`.moon-icon`);if(e&&t&&n){let r=window.matchMedia(`(prefers-color-scheme: dark)`).matches,i=localStorage.getItem(`theme`)||(r?`dark`:`light`);function a(){document.documentElement.setAttribute(`data-theme`,i),i===`dark`?(t.style.display=`block`,n.style.display=`none`):(t.style.display=`none`,n.style.display=`block`),localStorage.setItem(`theme`,i)}e.addEventListener(`click`,()=>{i=i===`light`?`dark`:`light`,a()}),a()}var r=document.getElementById(`search-toggle`),i=document.getElementById(`search-overlay`),a=document.getElementById(`search-input`),o=document.getElementById(`search-results`);r&&i&&a&&o&&(r.addEventListener(`click`,()=>{i.style.display=`flex`,a.focus()}),i.addEventListener(`click`,e=>{e.target===i&&(i.style.display=`none`)}),document.addEventListener(`keydown`,e=>{e.key===`Escape`&&(i.style.display=`none`)}),a.addEventListener(`input`,async()=>{let e=a.value.trim();if(!e)o.innerHTML=``;else try{let t=await(await fetch(`/search-index.json`)).json();o.innerHTML={search:function(e){let n=[],r=e.toLowerCase();for(let e=0;e<t.length;e++){let i=t[e],a=i.title.toLowerCase().includes(r),o=i.body.toLowerCase().includes(r);(a||o)&&n.push({score:a?2:1,id:e})}return n.sort((e,t)=>t.score-e.score)}}.search(e).map(e=>{let n=t[e.id];return`<div class="search-result"><a href="${n.url}">${n.title}</a></div>`}).join(``)||`<div class="no-results">No results found</div>`}catch(e){console.error(`Search error:`,e),o.innerHTML=`<div class="no-results">Error loading search results: ${e instanceof Error?e.message:`Unknown error`}</div>`}}));</script></body></html>
